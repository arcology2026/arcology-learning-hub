</style></head><body><main class="wrap">
<section class="hero"><div class="brand">ARCOLOGY TEACHING HUB</div><h1>產品零件英文速查</h1><p>雙向查詢・分級瀏覽・今日挑戰・錯題複習</p></section>
<nav class="tabs"><button class="tab active" data-panel="lookup">速查</button><button class="tab" data-panel="challenge">今日挑戰</button><button class="tab" data-panel="flash">錯題單字卡</button></nav>
<section id="lookup" class="panel active"><div class="card"><input id="search" class="search" placeholder="輸入中文或英文，例如：滾子 / roller"><div class="chips" id="freqChips"><button class="chip active" data-freq="all">全部</button><button class="chip" data-freq="high">高頻單字</button><button class="chip" data-freq="common">常見</button></div><div class="chips" id="catChips"></div><div id="results"></div></div></section>
<section id="challenge" class="panel"><div class="card"><div class="row"><label>試題來源<select id="source" class="select"><option value="high">高頻單字</option><option value="common">常見</option><option value="wrong">錯誤題庫</option></select></label><div>今日鼓勵點數<br><span id="score" class="score">0</span> 點</div></div><p class="tiny">每輪 2 題：1 題英文考中文＋1 題中文考英文。答對 +10 點；答錯自動加入錯誤題庫。</p><button id="start" class="btn">開始今日挑戰</button><div id="quiz"></div></div></section>
<section id="flash" class="panel"><div class="card"><div class="row"><div><b>錯誤題庫單字卡</b><div class="tiny">只複習曾答錯的單字；點卡片翻面。</div></div><button id="clearWrong" class="btn ghost">清空錯題</button></div><div id="flashArea"></div></div></section>
<p class="tiny">教材依《產品及零件基礎英語》整理；保留公司教材既有用語。高頻／常見依原教材紅字／黑字分類；「全部」另包含少數使用詞彙。</p>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={freq:'all',cat:'全部'}; const labels={high:'高頻',common:'常見',rare:'少數使用'};
function renderCats(){let cats=['全部',...new Set(TERMS.map(x=>x.cat))];$('#catChips').innerHTML=cats.map(c=>`<button class="chip ${c==='全部'?'active':''}" data-cat="${c}">${c}</button>`).join('');$$('#catChips .chip').forEach(b=>b.onclick=()=>{$$('#catChips .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.cat=b.dataset.cat;renderResults()})}
function renderResults(){let q=$('#search').value.trim().toLowerCase();let arr=TERMS.filter(t=>(state.freq==='all'||t.freq===state.freq)&&(state.cat==='全部'||t.cat===state.cat)&&(!q||(t.zh+t.en+t.cat).toLowerCase().includes(q)));$('#results').innerHTML=arr.length?arr.map(t=>`<div class="result"><div class="zh">${t.zh}</div><div class="en">${t.en}</div><div class="meta"><span class="badge ${t.freq}">${labels[t.freq]}</span><span class="badge">${t.cat}</span></div></div>`).join(''):`<div class="empty">找不到符合的單字</div>`}
$('#search').oninput=renderResults; $$('#freqChips .chip').forEach(b=>b.onclick=()=>{$$('#freqChips .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.freq=b.dataset.freq;renderResults()});renderCats();renderResults();
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.panel).classList.add('active');if(b.dataset.panel==='flash')renderFlash()});
const wrong=()=>JSON.parse(localStorage.getItem('arcology_wrong')||'[]'); const saveWrong=a=>localStorage.setItem('arcology_wrong',JSON.stringify([...new Set(a)]));
function todayKey(){return 'arcology_score_'+new Date().toISOString().slice(0,10)} function getScore(){return +localStorage.getItem(todayKey())||0} function addScore(n){localStorage.setItem(todayKey(),getScore()+n);showScore()} function showScore(){$('#score').textContent=getScore()} showScore();
let questions=[],qi=0;
function poolFor(v){if(v==='wrong')return TERMS.filter(t=>wrong().includes(t.id));return TERMS.filter(t=>t.freq===v)}
function pick(arr,n,exclude=[]){return [...arr].filter(x=>!exclude.includes(x.id)).sort(()=>Math.random()-.5).slice(0,n)}
function makeQuestion(term,dir,pool){let answer=dir==='en-zh'?term.zh:term.en;let distract=pick(pool.filter(t=>t.id!==term.id),3).map(t=>dir==='en-zh'?t.zh:t.en);let opts=[answer,...distract].sort(()=>Math.random()-.5);return{term,dir,answer,opts}}
$('#start').onclick=()=>{let src=$('#source').value,pool=poolFor(src);if(pool.length<4){$('#quiz').innerHTML=`<div class="empty">${src==='wrong'?'錯誤題庫至少需要 4 個單字，才能產生選擇題。':'可用題目不足。'}</div>`;return}let chosen=pick(pool,2);questions=[makeQuestion(chosen[0],'en-zh',pool),makeQuestion(chosen[1],'zh-en',pool)];qi=0;renderQ()};
function renderQ(){if(qi>=questions.length){$('#quiz').innerHTML=`<div class="qbox"><div class="prompt">今日挑戰完成</div><p>目前累積 <span class="score">${getScore()} 點</span>。可切換試題來源再挑戰。</p></div>`;return}let q=questions[qi];$('#quiz').innerHTML=`<div class="qbox"><div class="qtitle">第 ${qi+1}/2 題｜${q.dir==='en-zh'?'英文 → 中文':'中文 → 英文'}</div><div class="prompt">${q.dir==='en-zh'?q.term.en:q.term.zh}</div><div class="options">${q.opts.map(o=>`<button class="option">${o}</button>`).join('')}</div><div class="feedback"></div></div>`;$$('#quiz .option').forEach(b=>b.onclick=()=>answer(b,q))}
function answer(btn,q){$$('#quiz .option').forEach(b=>b.disabled=true);if(btn.textContent===q.answer){btn.classList.add('correct');$('.feedback').textContent='答對了！+10 鼓勵點數';addScore(10)}else{btn.classList.add('wrong');$$('#quiz .option').find(b=>b.textContent===q.answer)?.classList.add('correct');$('.feedback').textContent=`再複習一次，正確答案：${q.answer}`;saveWrong([...wrong(),q.term.id])}setTimeout(()=>{qi++;renderQ()},1100)}
let fi=0,flipped=false;function renderFlash(){let arr=TERMS.filter(t=>wrong().includes(t.id));if(!arr.length){$('#flashArea').innerHTML='<div class="empty">目前沒有錯題。答錯的單字會自動出現在這裡。</div>';return}fi=Math.min(fi,arr.length-1);let t=arr[fi];$('#flashArea').innerHTML=`<div class="flash"><div class="tiny">${fi+1} / ${arr.length} ・ ${t.cat}</div><div class="front">${flipped?t.en:t.zh}</div><div class="back">${flipped?t.zh:'點一下看答案'}</div></div><div class="row"><button id="prev" class="btn secondary">上一張</button><button id="master" class="btn">我會了，移出錯題</button><button id="next" class="btn secondary">下一張</button></div>`;$('.flash').onclick=()=>{flipped=!flipped;renderFlash()};$('#prev').onclick=()=>{fi=(fi-1+arr.length)%arr.length;flipped=false;renderFlash()};$('#next').onclick=()=>{fi=(fi+1)%arr.length;flipped=false;renderFlash()};$('#master').onclick=()=>{saveWrong(wrong().filter(id=>id!==t.id));fi=0;flipped=false;renderFlash()}}
$('#clearWrong').onclick=()=>{if(confirm('確定清空錯誤題庫？')){saveWrong([]);renderFlash()}};
</script></body></html>
